spring.application.name=PartTimeGo

# ==================== MySQL ====================
spring.datasource.url=jdbc:mysql://localhost:3306/parttimego?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ==================== MyBatis-Plus ====================
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ==================== 慢查询日志 ====================
logging.level.com.example.demo.mapper=debug
logging.level.com.baomidou.mybatisplus=debug
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== Redis ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:PartTimeGo2024SecretKeyMustBeLongEnoughForHS256!!}
jwt.expiration=86400000

# ==================== Jackson ====================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ==================== 服务端口 ====================
server.port=8088

# ==================== 文件上传 ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== 阿里云OSS ====================
aliyun.oss.endpoint=${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
aliyun.oss.bucketName=${OSS_BUCKET:java-ai-ffz01}
aliyun.oss.accessKeyId=${OSS_ACCESS_KEY_ID:}
aliyun.oss.accessKeySecret=${OSS_ACCESS_KEY_SECRET:}

# ==================== RabbitMQ ====================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
